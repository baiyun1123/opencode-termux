name: Build OpenCode 2 Android
on:
  push:
    branches: ['feat/opencode2-android-auto-build']
  pull_request:
    paths: ['scripts/**v2*', 'scripts/build-bun-android.sh', 'scripts/build-opencode2-android.sh', 'patches/**', 'config/**', 'tests/**', '.github/workflows/*v2.yml']
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        options: [ubuntu-24.04, self-hosted]
        default: ubuntu-24.04
        description: Hosted experimental build or provisioned dedicated runner
      opencode_commit:
        type: string
        default: ''
        description: Optional full OpenCode SHA for a test build (release prohibited)
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: v2-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: scripts/check-static-v2.sh
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.repository == 'baiyun1123/opencode-termux')
    needs: static
    # Never execute fork PR code on a persistent self-hosted runner.
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted","linux","x64","opencode-v2"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 360
    env:
      WORK_DIR: ${{ github.workspace }}/build-v2
      V2_RESOURCE_GATE: '1'
      V2_RESOURCE_PROFILE: ${{ inputs.runner == 'self-hosted' && 'dedicated' || 'hosted-experimental' }}
      V2_JOBS: '2'
      OPENCODE_SHA_INPUT: ${{ inputs.opencode_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resource inventory and test source override
        run: |
          mkdir -p "$WORK_DIR/logs"
          free -h | tee "$WORK_DIR/logs/resources.txt"
          df -h . | tee -a "$WORK_DIR/logs/resources.txt"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          sha = os.environ['OPENCODE_SHA_INPUT']
          if sha:
              assert re.fullmatch('[0-9a-f]{40}', sha), 'Full commit SHA required'
              p = Path('config/versions-v2.json')
              c = json.loads(p.read_text())
              c['opencode']['commit'] = sha
              p.write_text(json.dumps(c, indent=2)+'\n')
          PY
      - name: Install Ubuntu build prerequisites
        if: inputs.runner != 'self-hosted'
        run: scripts/setup-host-v2.sh 2>&1 | tee "$WORK_DIR/logs/setup-host.log"
      - name: Restore verified tool archives
        if: inputs.runner != 'self-hosted'
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: build-v2/downloads
          key: v2-host-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/toolchains-v2.json') }}
      - name: Install fixed host Bun, Zig, NDK and LLVM
        if: inputs.runner != 'self-hosted'
        id: bootstrap
        run: python3 scripts/bootstrap-v2.py 2>&1 | tee "$WORK_DIR/logs/bootstrap.log"
      - name: Save verified tool archives
        if: steps.bootstrap.outcome == 'success' && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-v2/downloads
          key: v2-host-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/toolchains-v2.json') }}
      - name: Check provisioned toolchain
        run: scripts/preflight-v2.sh 2>&1 | tee "$WORK_DIR/logs/preflight.log"
      - id: key
        run: echo "key=$(python3 scripts/v2.py key)" >> "$GITHUB_OUTPUT"
      - name: Prepare locked source trees
        run: scripts/prepare-source-v2.sh 2>&1 | tee "$WORK_DIR/logs/sources.log"
      - name: Restore OpenTUI output
        id: opentui-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build-v2/libopentui.so
            build-v2/libopentui.so.provenance.json
          key: v2-opentui-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.key }}
      - name: Compile Android OpenTUI renderer
        if: steps.opentui-cache.outputs.cache-hit != 'true'
        run: scripts/build-opentui-v2.sh 2>&1 | tee "$WORK_DIR/logs/opentui-build.log"
      - name: Verify Android OpenTUI renderer
        run: |
          source scripts/env-v2.sh
          python3 scripts/v2.py cache-check "$OPENTUI_LIB"
          python3 scripts/v2.py elf "$OPENTUI_LIB"
      - name: Cache verified OpenTUI output before building Bun
        if: steps.opentui-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build-v2/libopentui.so
            build-v2/libopentui.so.provenance.json
          key: v2-opentui-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.key }}
      - name: Restore patched Bun output
        id: bun-cache
        uses: actions/cache/restore@v4
        with:
          path: build-v2/dist/bun-android
          key: v2-bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.key }}
      - name: Compile patched Android Bun runtime
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: scripts/build-bun-android.sh 2>&1 | tee "$WORK_DIR/logs/bun-build.log"
      - name: Verify patched Android Bun runtime
        run: |
          source scripts/env-v2.sh
          python3 scripts/v2.py cache-check "$DIST_DIR/bun-android/bun"
          python3 scripts/v2.py elf "$DIST_DIR/bun-android/bun"
      - name: Cache verified patched Bun output before building CLI
        if: steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-v2/dist/bun-android
          key: v2-bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.key }}
      - name: Compile OpenCode CLI and verify packages
        run: |
          scripts/build-opencode2-android.sh 2>&1 | tee "$WORK_DIR/logs/opencode-build.log"
          scripts/make-packages-v2.sh 2>&1 | tee "$WORK_DIR/logs/package-build.log"
          scripts/verify-packages-v2.sh 2>&1 | tee "$WORK_DIR/logs/package-verification.log"
      - name: Save logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-build-logs-${{ github.run_id }}
          path: build-v2/logs/
      - name: Save native diagnostic outputs even if a later stage fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-native-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            build-v2/libopentui.so
            build-v2/libopentui.so.provenance.json
            build-v2/dist/bun-android/bun
            build-v2/dist/bun-android/bun.provenance.json
      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: opencode2-android-${{ github.run_id }}
          path: build-v2/packages/
          if-no-files-found: error
      - name: Runtime status
        if: always()
        run: echo 'Android runtime, TUI, PTY and device regression tests are **NOT TESTED** by this Linux workflow.' >> "$GITHUB_STEP_SUMMARY"
